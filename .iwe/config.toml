format = "markdown"
version = 4

[workspace]
date_format = "%Y-%m-%d"
path = ""

[markdown]
date_format = "%b %d, %Y"
# detected: 1342 links end in .md, 6634 have no extension
refs_extension = ""
# detected: 1104 links resolve relative to their own directory, 47 from the workspace root
refs_path = "relative"
# detected: 0 link texts match their target title, 132 diverge
refs_text = "preserve"
# detected: 11 wiki links carry a path, 1 are bare names
wiki_link_path = "full"

[markdown.formatting]
# detected: 1161 breaks use trailing spaces vs 0 backslash
line_break_style = "spaces"
# detected: 11681 of 21429 ordered list items indent content to column 4
ordered_list_content_indent = 4
# detected: 1161 hard line breaks (0 backslash, 1161 trailing spaces)
preserve_line_breaks = true
# detected: 1851 of 3767 files contain runs of blank lines
preserve_newlines = true
# detected: 4650 of 4661 thematic breaks are 3 characters long
rule_token_count = 3

[djot]
date_format = "%b %d, %Y"
refs_extension = ""
refs_path = "relative"
refs_text = "preserve"

[djot.formatting]
line_break_style = "spaces"
ordered_list_content_indent = 4
preserve_line_breaks = true
preserve_newlines = true
rule_token_count = 3

[completion]
# detected: 12 wiki links vs 7976 markdown links
link_format = "markdown"

[search]
# detected: 5588 stopword hits for english, 545 for the next language
language = "english"

[templates.default]
document_template = """
# {{title}}

{{content}}"""
# detected: 3647 of 3767 filenames use slug style
key_template = "{{slug}}"

[commands.default]
run = "claude -p"
timeout_seconds = 120

[actions.emoji]
command = "default"
input_template = """
Here's a text that I'm going to ask you to edit. The text is marked with {{context_start}} {{context_end}} tags.

- The part you'll need to update is marked with {{update_start}} {{update_end}} tags.
- You can't replace entire text, your answer will be inserted in between {{update_start}} {{update_end}} tags.
- Add a relevant emoji one per list item (prior to list item text), header (prior to header text) or paragraph. Keep the text otherwise unchanged.
- Don't include the {{update_start}} {{update_end}} tags in your answer.

{{context_start}}

{{context}}

{{context_end}}
"""
title = "Emojify"
type = "transform"

[actions.expand]
command = "default"
input_template = """
Here's a text that I'm going to ask you to edit. The text is marked with {{context_start}}{{context_end}} tag.

The part you'll need to update is marked with {{update_start}}{{update_end}}.

{{context_start}}

{{context}}

{{context_end}}

- You can't replace entire text, your answer will be inserted in place of the {{update_start}}{{update_end}}. Don't include the {{context_start}}{{context_end}} and {{context_start}}{{context_end}} tags in your output.
- Preserve the links in the text. Do not return list item "-" or header "#" prefix

Expand the text you need to update, generate a couple paragraphs.
"""
title = "Expand"
type = "transform"

[actions.extract]
key_template = "{{id}}"
link_type = "markdown"
title = "Extract"
type = "extract"

[actions.extract_all]
key_template = "{{id}}"
link_type = "markdown"
title = "Extract all subsections"
type = "extract_all"

[actions.inline_quote]
inline_type = "quote"
keep_target = false
title = "Inline quote"
type = "inline"

[actions.inline_section]
inline_type = "section"
keep_target = false
title = "Inline section"
type = "inline"

[actions.keywords]
command = "default"
input_template = """
Here's a text that I'm going to ask you to edit. The text is marked with {{context_start}}{{context_end}} tag.

The part you'll need to update is marked with {{update_start}}{{update_end}}.

{{context_start}}

{{context}}

{{context_end}}

- You can't replace entire text, your answer will be inserted in place of the {{update_start}}{{update_end}}. Don't include the {{context_start}}{{context_end}} and {{context_start}}{{context_end}} tags in your output.

Mark most important keywords with bold using ** markdown syntax. Keep the text unchanged!
"""
title = "Keywords"
type = "transform"

[actions.link]
key_template = "{{id}}"
link_type = "markdown"
title = "Link"
type = "link"

[actions.rewrite]
command = "default"
input_template = """
Here's a text that I'm going to ask you to edit. The text is marked with {{context_start}}{{context_end}} tag.

The part you'll need to update is marked with {{update_start}}{{update_end}}.

{{context_start}}

{{context}}

{{context_end}}

- You can't replace entire text, your answer will be inserted in place of the {{update_start}}{{update_end}}. Don't include the {{context_start}}{{context_end}} and {{context_start}}{{context_end}} tags in your output.
- Preserve the links in the text. Do not return list item "-" or header "#" prefix

Your goal is to rewrite a given text to improve its clarity and readability. Ensure the language remains personable and not overly formal. Focus on simplifying language, organizing sentences logically, and removing ambiguity while maintaining a conversational tone.
"""
title = "Rewrite"
type = "transform"

[actions.sort]
reverse = false
title = "Sort A-Z"
type = "sort"

[actions.sort_desc]
reverse = true
title = "Sort Z-A"
type = "sort"

[actions.today]
document_template = """
# {{today}}

{{content}}
"""
key_template = "{{today}}"
title = "Add Date"
type = "attach"

[schemas]
