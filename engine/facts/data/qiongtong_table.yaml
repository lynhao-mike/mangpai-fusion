schema_version: qiongtong-lookup/v1
entries:
  甲:
    寅:
      listed_stems: [丙, 癸]
      raw_excerpt: "正月甲木，初春尚有余寒，得丙癸逢，富贵双全。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:24"
    卯:
      listed_stems: [庚, 戊, 丁]
      raw_excerpt: "正二月甲木，有庚戊者上命。如有丁透，大富大贵之命也。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:29-30"
    辰:
      listed_stems: [庚, 壬]
      raw_excerpt: "三月甲木，木气相竭。先取庚金，次用壬水。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:31"
    巳:
      listed_stems: [癸, 丁]
      raw_excerpt: "四月甲木退气，丙火司权，先癸後丁。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:40"
    午:
      listed_stems: [癸, 丁, 庚]
      raw_excerpt: "五月先癸後丁庚金次之。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:44"
    未:
      listed_stems: [丁, 庚]
      raw_excerpt: "六月三伏生寒，丁火退气。先丁後庚，无癸亦可。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:44"
    申:
      listed_stems: [丁, 庚, 甲]
      raw_excerpt: "丁火熔金，必赖甲木引助，方成洪炉。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:64"
    酉:
      listed_stems: [丁, 丙, 庚]
      raw_excerpt: "八月甲木，木囚金旺。丁火为先，次用丙火，庚金再次。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:65"
    戌:
      listed_stems: [丁, 癸]
      raw_excerpt: "九月甲木，端用丁癸，见戊透必贵。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:80"
    亥:
      listed_stems: [庚, 丁, 丙]
      raw_excerpt: "十月甲木，庚丁为要，丙火次之。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:84"
    子:
      listed_stems: [丁, 庚, 丙]
      raw_excerpt: "十一月甲木，木性生寒，丁先庚後，丙火佐之。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:88"
    丑:
      listed_stems: [庚, 丁]
      raw_excerpt: "先用庚劈甲，方引丁火始得木火有通明之象，故丁次之。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:92"
  乙:
    寅:
      listed_stems: [丙, 癸]
      raw_excerpt: "正月乙木，必须用丙，因天气尤有余寒，非丙不暖，虽有癸水，恐凝寒气，故以丙火为先，癸水次之。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:100"
    卯:
      listed_stems: [丙, 癸]
      raw_excerpt: "二月乙木，端用丙癸，或支成木局，有癸透乃作贵命，更得丙泄木气，上上之命，但须透癸。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:105"
    辰:
      listed_stems: [癸, 丙]
      raw_excerpt: "三月乙木，阳气愈炽，先癸後丙。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:108"
    巳:
      listed_stems: [癸, 丙, 庚, 辛]
      raw_excerpt: "四月乙木专用癸水，丙火酌用，虽以庚辛佐癸，须辛透为清。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:120"
    午:
      listed_stems: [癸, 丙]
      raw_excerpt: "五月乙木，丁火司权，禾稼俱旱。上半月属阳，仍用癸水。下半月属阴，三伏生寒，丙癸齐用。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:123"
    未:
      listed_stems: [丙, 癸]
      raw_excerpt: "六月乙木，木性且寒，柱多金水，丙火为尊。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:126"
    申:
      listed_stems: [己, 丙, 癸]
      raw_excerpt: "七月喜己土为用，或不见丙癸。己土必不可少，此则以火为妻，土为子。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:138-139"
    酉:
      listed_stems: [癸, 丙, 丁]
      raw_excerpt: "在白露之後，桂蕊未开，端用癸水以滋桂萼。若秋分後，桂花已开，却喜向阳，又宜用丙，癸水次之，丙癸两透，科甲名臣。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:142-143"
    戌:
      listed_stems: [癸, 辛]
      raw_excerpt: "九月乙木，根枯叶落，必赖癸水滋养。如见甲申时，名为藤萝系甲，可秋可冬。若见癸水，又遇辛金发水之源，定主科甲。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:149"
    亥:
      listed_stems: [丙, 戊]
      raw_excerpt: "十月乙木，木不受气，而壬水司令，取丙为用，戊土次之。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:154"
    子:
      listed_stems: [丙]
      raw_excerpt: "十一月乙木，花木寒冻，一阳来复，喜用丙火解冻，则花木有向阳之意，不宜用癸以冻花木，故端用丙火。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:156"
    丑:
      listed_stems: [丙]
      raw_excerpt: "冬月之木，虽取戊制水，不可作用，端取丙火则可。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:160"
  丙:
    寅:
      listed_stems: [壬, 庚]
      raw_excerpt: "正月丙火，三阳开泰，火气渐炎，取壬为尊，庚金佐之，壬庚两透，科甲定然，即壬透庚藏，亦有异途显达。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:170"
    卯:
      listed_stems: [壬]
      raw_excerpt: "二月丙火，阳气舒升，端用壬水，壬透天干，不见丁化，加以庚辛已亦透，壬水有根，定主科甲。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:196"
    辰:
      listed_stems: [壬, 甲]
      raw_excerpt: "三月丙火，气渐炎升，用壬水，或成土局，取甲木为辅，壬不可离，壬申两透，科甲定宜，惟忌庚出制甲，则秀才而已。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:211"
    巳:
      listed_stems: [壬, 庚]
      raw_excerpt: "四月丙火，建禄於巳，火势炎炎，宜专用壬水，解炎威之力，成既济之功。如无壬水，孤阳失辅，难透清光，得庚发水源，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:220"
    午:
      listed_stems: [壬, 庚]
      raw_excerpt: "五月丙火愈炎，得壬庚高透，方为上命。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:240"
    未:
      listed_stems: [壬, 庚]
      raw_excerpt: "六月丙火退气，三代生寒，壬水为用，取庚辅佐。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:254"
    申:
      listed_stems: [壬, 戊]
      raw_excerpt: "七月丙火，太阳转西，阳气衰矣，日近西山，见土皆晦，惟日照湖海，暮夜光天，故仍用壬水辅映光辉。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:269-270"
    酉:
      listed_stems: [壬, 癸]
      raw_excerpt: "一壬藏支，亦主秀才。或戊多困水，则假作斯文，若无壬水，癸亦可用，但功名不久。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:281-282"
    戌:
      listed_stems: [甲, 壬]
      raw_excerpt: "九月丙火，火气愈退，所忌土晦光，必须先用甲木，次取壬水。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:296"
    亥:
      listed_stems: [甲, 戊, 庚]
      raw_excerpt: "十月丙火，太阳失令，得见甲戊庚出干，可云科甲，主为人性好清高，斯文领袖。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:312"
    子:
      listed_stems: [壬, 戊]
      raw_excerpt: "十一月丙火，冬至一阳生，弱中复强，壬水为最，戊土佐之。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:328"
    丑:
      listed_stems: [壬, 甲]
      raw_excerpt: "十二月丙火，气进二阳，每雪欺霜，喜壬为用，己土司令，土多又不可少甲，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:345"
  丁:
    寅:
      listed_stems: [庚]
      raw_excerpt: "正月丁火，甲木当权，乃为母旺，非庚不能劈甲，何以引丁，姑用庚金。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:368"
    卯:
      listed_stems: [庚, 甲]
      raw_excerpt: "二月丁火，湿乙伤丁，先庚後甲，非不能去乙，非甲不能引丁。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:384"
    辰:
      listed_stems: [甲, 庚]
      raw_excerpt: "三月丁火，戊土司令，泄弱丁气，先用甲木引丁制土，次看庚金，庚甲两透，定主科甲，或一藏一透，终非白丁。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:400"
    巳:
      listed_stems: [甲, 庚]
      raw_excerpt: "四月丁火乘旺，虽取甲引丁，必用庚劈甲，伐甲、方云木火通明，甲多、又取庚为先。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:406"
    午:
      listed_stems: [壬, 庚, 甲]
      raw_excerpt: "若干支无火局，有水透干，须用甲木，又要庚劈甲方明，木火通明，主大富贵，或木少火多，焚其木性，不能光透九霄，荣华不久。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:421-423"
    未:
      listed_stems: [甲, 壬, 庚]
      raw_excerpt: "六月丁火，阴柔退气，但值三伏生寒，丁弱极矣，专取甲木，壬水次之。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:444-445"
    申:
      listed_stems: [甲, 庚, 丙]
      raw_excerpt: "七月丁火，退气柔弱，端用甲木，金虽乘旺司权，无伤丁之理，仍取庚劈甲，为引火之物，或借丙暖金晒甲，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:459"
    酉:
      listed_stems: [甲, 丙, 庚]
      raw_excerpt: "八月甲丙庚皆用，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:460"
    戌:
      listed_stems: [甲, 庚]
      raw_excerpt: "九月端用甲庚，大抵甲一庚，乙不离丙，其理极明，或见甲庚丙皆透，必主科甲，无甲用乙者，富贵皆小，且富而不贵者多。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:460"
    亥:
      listed_stems: [庚, 甲]
      raw_excerpt: "三冬丁火微寒，端用庚甲，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:492"
    子:
      listed_stems: [甲, 庚, 戊, 癸]
      raw_excerpt: "三冬丁火，甲木为尊，庚金佐之，戊癸权宜酌用可也。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:511"
    丑:
      listed_stems: [甲, 庚, 戊, 癸]
      raw_excerpt: "三冬丁火，甲木为尊，庚金佐之，戊癸权宜酌用可也。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:511"
  戊:
    寅:
      listed_stems: [丙, 癸, 甲]
      raw_excerpt: "正二月先丙後，癸又次之，三月先甲後丙，癸又次之，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:539"
    卯:
      listed_stems: [丙, 癸, 甲]
      raw_excerpt: "正二月先丙後，癸又次之，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:539"
    辰:
      listed_stems: [甲, 丙, 癸]
      raw_excerpt: "三月先甲後丙，癸又次之，因戊土司权故也，有甲、丙、癸、三者齐透，必主一品当朝，或二透一藏，亦登金榜，二藏一透，也可异途。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:539"
    巳:
      listed_stems: [甲, 丙, 癸]
      raw_excerpt: "四月戊土，阳气发升，寒气内藏，外实内虚，不畏火炎，无阳气相催，万物不长，故先用甲疏劈，次取丙癸为佐。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:566"
    午:
      listed_stems: [壬, 甲, 丙, 癸]
      raw_excerpt: "五月戊土，仲夏火炎，先看壬水，次取甲木，丙火酌用，用癸力微。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:581"
    未:
      listed_stems: [癸, 丙, 甲]
      raw_excerpt: "六月戊土，遇夏乾枯，先看癸水，次用丙火甲木。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:587"
    申:
      listed_stems: [丙, 癸, 甲]
      raw_excerpt: "七月戊土，阳气渐入，寒气渐出，先丙後癸，甲木次之。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:602"
    酉:
      listed_stems: [丙, 癸]
      raw_excerpt: "八月戊土，金泄身寒，赖丙照暖，喜水滋润，先丙後癸，不必木疏。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:616"
    戌:
      listed_stems: [甲, 癸, 丙]
      raw_excerpt: "九月戊土当权，不可专用丙，先看甲木，次取癸水，郤忌化合，见金先用癸水，後取丙火，配合支干，方成有生之土，定发云程。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:622"
    亥:
      listed_stems: [甲, 丙]
      raw_excerpt: "十月戊土，时值小阳，阳气略出，先用甲木，次取丙火，非甲，土不灵，非丙，土不暖，安能发生万物，甲丙两出，富贵中人。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:645"
    子:
      listed_stems: [丙, 甲]
      raw_excerpt: "十一二月严寒冰冻，丙火为尊，甲木为佐，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:661"
    丑:
      listed_stems: [丙, 甲]
      raw_excerpt: "十一二月严寒冰冻，丙火为尊，甲木为佐，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:661"
  己:
    寅:
      listed_stems: [丙, 戊]
      raw_excerpt: "正月己土，田园犹冻，盖因腊气未除，余寒未退，故丙为尊"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:679"
    卯:
      listed_stems: [甲, 癸, 丙]
      raw_excerpt: "二月己土，阳气渐升，虽禾稼未成，万物出土，田园未展，先取甲木疏之，忌合，次取癸水润之，甲癸出干，定主科甲，加以一丙出透，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part1.md:687"
    辰:
      listed_stems: [丙, 癸, 甲]
      raw_excerpt: "三月己土，正栽培禾稼之时，先丙後癸，土暖而润，随用甲疏，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:1"
    巳:
      listed_stems: [癸, 丙]
      raw_excerpt: "三夏己土，杂气才官，禾稼在田，最喜甘沛，取癸为要，次用丙火，夏无太阳，禾稼不长，故无癸曰旱田，无丙曰孤阴。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:15"
    午:
      listed_stems: [癸, 丙]
      raw_excerpt: "三夏己土，杂气才官，禾稼在田，最喜甘沛，取癸为要，次用丙火，夏无太阳，禾稼不长，故无癸曰旱田，无丙曰孤阴。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:15"
    未:
      listed_stems: [癸, 丙]
      raw_excerpt: "三夏己土，杂气才官，禾稼在田，最喜甘沛，取癸为要，次用丙火，夏无太阳，禾稼不长，故无癸曰旱田，无丙曰孤阴。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:15"
    申:
      listed_stems: [癸, 丙]
      raw_excerpt: "三秋己土，万物收藏之际，外虚内实，寒气渐升，须丙火温之，癸水润之，不特此也，且癸能泄金，丙能制金，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:34"
    酉:
      listed_stems: [癸, 丙]
      raw_excerpt: "三秋己土，万物收藏之际，外虚内实，寒气渐升，须丙火温之，癸水润之，不特此也，且癸能泄金，丙能制金，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:34"
    戌:
      listed_stems: [癸, 丙, 辛, 甲]
      raw_excerpt: "总之三秋己土，先癸後丙，取辛辅癸，九月土盛，宜甲木疏之，余皆酌用。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:40"
    亥:
      listed_stems: [丙, 甲]
      raw_excerpt: "三冬己土，湿泥寒冻，非丙暖不生，取丙为尊，甲木参酌，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:52"
    子:
      listed_stems: [丙, 甲]
      raw_excerpt: "三冬己土，湿泥寒冻，非丙暖不生，取丙为尊，甲木参酌，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:52"
    丑:
      listed_stems: [丙, 甲]
      raw_excerpt: "三冬己土，湿泥寒冻，非丙暖不生，取丙为尊，甲木参酌，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:52"
  庚:
    寅:
      listed_stems: [丙, 甲]
      raw_excerpt: "先用丙暖庚性，又虑土厚埋金，须甲疏泄，丙甲两透，科甲显荣，二者透一，亦有生监，丙藏甲透，异路功名。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:76"
    卯:
      listed_stems: [丁, 甲, 丙]
      raw_excerpt: "故二月庚金，专用丁火，借甲引丁，借庚劈甲，无丁用丙者，富贵多出於勉强。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:91"
    辰:
      listed_stems: [甲, 丁]
      raw_excerpt: "三月庚金，戊土司令，无生金之理，有埋金之忧，故先甲後丁，不用庚劈甲，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:109"
    巳:
      listed_stems: [壬, 戊, 丙]
      raw_excerpt: "丙不熔金，故不畏火炎，丙亦可作用，但先壬水，方得中和，故曰群金生夏，喜用勾陈，次取戊土，丙火佐之，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:122"
    午:
      listed_stems: [壬, 癸]
      raw_excerpt: "五月庚金，丁火旺烈，庚金败地，专用壬水，癸又次之。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:128"
    未:
      listed_stems: [丁, 甲]
      raw_excerpt: "六月庚金，三伏生寒，顽钝极矣，先用丁火，次取甲木。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:134"
    申:
      listed_stems: [丁, 甲]
      raw_excerpt: "七月庚金，刚锐极矣，专用丁火煆炼，次取木引丁，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:151"
    酉:
      listed_stems: [丁, 甲, 丙]
      raw_excerpt: "八月庚金，刚锐支退，用丁甲，丙不可少，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:156"
    戌:
      listed_stems: [甲, 壬]
      raw_excerpt: "九月庚金，戊土司令，最怕土厚埋金，宜先用甲疏，後用壬洗，则金自出矣，忌见己土浊壬。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:172"
    亥:
      listed_stems: [丁, 丙]
      raw_excerpt: "十月庚金，水冷性寒，非丁莫造，非丙不暖。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:187"
    子:
      listed_stems: [丁, 甲, 丙]
      raw_excerpt: "十一月庚金，天气严寒，仍取丁甲，次取丙火照暖，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:200"
    丑:
      listed_stems: [丙, 丁, 甲]
      raw_excerpt: "十二月庚金，寒气太重，且多湿泥，愈寒愈冻，先取丙火解冻，次取丁火炼金，甲亦不可少。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:215"
  辛:
    寅:
      listed_stems: [己, 壬, 庚]
      raw_excerpt: "故正月辛金，先己後壬，己为君，庚为佐，如用丙火须参看，用己，火妻土子，用壬，金妻水子。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:232"
    卯:
      listed_stems: [壬, 甲]
      raw_excerpt: "二月辛金，阳和之际，壬水为尊，见戊己为病，得甲制伏，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:241"
    辰:
      listed_stems: [壬, 甲]
      raw_excerpt: "三月辛金，戊土司令，辛承正气，母旺子相，先壬後甲，壬甲两透，富贵必然，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:265"
    巳:
      listed_stems: [壬, 癸, 甲]
      raw_excerpt: "四月辛金，时道首夏，忌丙火之燥烈，喜壬水之洗淘，支成金局，水透出干，有木制戊，名一清澈底，科甲功名，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:271-273"
    午:
      listed_stems: [己, 壬, 癸]
      raw_excerpt: "辛金失令，阴柔之极，不宜煆炼，须己壬兼用，何也，己为泥沙，壬为湖海，己无壬不湿，辛无己不生，故壬己并用，无壬，癸亦可用，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:282-283"
    未:
      listed_stems: [壬, 庚, 甲]
      raw_excerpt: "恐掩金光，先用壬水，取庚佐之，壬庚两透，科甲功名，即不出干，藏支得所，亦有荣华，但忌戊出，得甲制之，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:293"
    申:
      listed_stems: [壬, 甲, 戊]
      raw_excerpt: "七月辛金，壬不在多，故书曰，水浅金多，号曰体全之象，壬水为尊，甲戊酌用可也，癸水不可为用。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:308"
    酉:
      listed_stems: [壬, 甲]
      raw_excerpt: "八月辛金，当权得令，旺之极矣，专用壬水淘洗，故云金见水以流通，如见戊己，则生扶太过，故以土为病，见甲制土，方妙，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:316"
    戌:
      listed_stems: [壬, 甲]
      raw_excerpt: "九月辛金，成土司令，母旺子相，须甲疏土，壬泄旺金，先壬後甲，壬甲两透，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:338"
    亥:
      listed_stems: [壬, 丙]
      raw_excerpt: "十月辛金，时值小阳，阳渐升，寒气将降，先用壬水，次取丙火，壬丙两透，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:356"
    子:
      listed_stems: [壬, 丙]
      raw_excerpt: "十一月辛金，癸水司令，为寒冬雨露，切忌癸出冻金，而困丙火，壬丙两透，不见戊癸，衣锦腰金，即壬藏丙透，一榜堪图。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:362"
    丑:
      listed_stems: [丙, 壬, 戊, 己]
      raw_excerpt: "十二月辛金，丙先壬後，戊己次之。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:369"
  壬:
    寅:
      listed_stems: [庚, 丙, 戊]
      raw_excerpt: "正月壬水，汪洋之象，能并百川之流，然水性柔弱，宜用庚金之源，庶不致汪洋无度，有庚丙戊三者齐透，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:396"
    卯:
      listed_stems: [戊, 辛, 庚]
      raw_excerpt: "二月壬水，寒气初除，有并流之象，不用丙暖，专取戊土辛金，二月壬水，先戊後辛，庚金次之。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:409"
    辰:
      listed_stems: [甲, 庚]
      raw_excerpt: "三月壬水，戊土司权，死有推山塞海之患，先用甲疏季土，次取庚金。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:416"
    巳:
      listed_stems: [壬, 辛, 庚]
      raw_excerpt: "四月壬水，丙火司权，水弱极矣，专取壬水比肩为助，次取辛金发源，且暗合丙火，庚金为佐。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:428"
    午:
      listed_stems: [癸, 庚, 辛]
      raw_excerpt: "五月壬水，丁旺壬弱，取癸为用，取庚为佐，无庚不能发水，无癸不能伤丁，五月壬水，辛癸亦可参用，其理与四月皆同。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:445"
    未:
      listed_stems: [辛, 甲, 癸]
      raw_excerpt: "六月壬水，先辛後甲，次取癸水。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:457"
    申:
      listed_stems: [戊, 丁]
      raw_excerpt: "七月壬水，庚金司令，壬得申之长生，源流自远，转弱为强，专用戊土，次取丁火佐戊制庚，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:462"
    酉:
      listed_stems: [甲, 庚]
      raw_excerpt: "八月壬水，栽用甲木，庚金次之，用甲者，水妻木子。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:477-481"
    戌:
      listed_stems: [甲, 丙]
      raw_excerpt: "九月壬水，栽用甲木，次用丙火，用土者，火妻土子。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:499"
    亥:
      listed_stems: [戊, 丙, 庚]
      raw_excerpt: "有戊无丙，难许推盈，十月壬水，专用戊丙，次取庚金。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:509-512"
    子:
      listed_stems: [戊, 丙]
      raw_excerpt: "十一月壬水，阳刃帮身，较前更旺，先取戊土，次用丙火，丙戊两透，富贵荣华，有戊无丙，略可言富，有丙无戊，好谋无成。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:522"
    丑:
      listed_stems: [丙, 甲, 丁]
      raw_excerpt: "腊月壬水，先取丙火，丁甲为佐，故水冷金寒爱丙丁，用火者，木妻火子。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:542"
  癸:
    寅:
      listed_stems: [辛, 庚, 丙]
      raw_excerpt: "辛金为主，庚金次之，丙亦可少"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:551"
    卯:
      listed_stems: [庚, 辛]
      raw_excerpt: "二月葵水，不刚不柔，乙木司令，泄弱元神，专用庚金为用，辛金次之，庚辛俱透，无丁出干者，贵由科甲，无庚辛者常人。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:554"
    辰:
      listed_stems: [丙, 辛, 甲]
      raw_excerpt: "三月癸水，要分清明谷雨，清明後，火气未炽，专用丙火，为阴阳合谐，谷雨後，虽用丙火，尚宜辛甲佐之，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:568"
    巳:
      listed_stems: [辛, 庚]
      raw_excerpt: "四月癸水，喜辛金为用，无辛用庚，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:587"
    午:
      listed_stems: [庚, 辛, 壬]
      raw_excerpt: "至弱无根，必须庚辛为生身之本，但丁火司权，金难敌火，安能滋养癸水，宜见比劫，方得辛金之用，五月癸水，庚辛壬参酌并用可也。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:590"
    未:
      listed_stems: [庚, 辛]
      raw_excerpt: "凡六癸日，多不验者，何也，俗士不知此理，因未中有乙巳同宫，破而不破，故癸水不能从杀，所以专用庚辛，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:595"
    申:
      listed_stems: [丁, 甲]
      raw_excerpt: "癸虽死申，殊不知申中有庚生之，名死处逢生，弱中复强，即运行西北，亦不死也，但庚司令，刚锐极矣，必取丁火为用，或丁透有甲，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:605"
    酉:
      listed_stems: [辛, 丙]
      raw_excerpt: "八月癸水，辛金虚灵，非顽金可比，正金白水清，故取辛金为用，丙火佐之，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:618"
    戌:
      listed_stems: [辛, 甲]
      raw_excerpt: "九月癸水，失令无根，戊土司权，克制太过，专用辛金发水之源，要比肩滋甲制戊方妙。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:628"
    亥:
      listed_stems: [庚, 辛]
      raw_excerpt: "十月癸水，旺中有弱，何也，因亥摇木，泄散元神，宜用庚辛为妙，得庚辛两透，不见丁伤者，功名有准。"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:641"
    子:
      listed_stems: [丙, 辛]
      raw_excerpt: "十一月癸水，值冰冻之时，金水无交欢之象，专用丙火解冻，庶不致成冰，又要辛金滋扶，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:655"
    丑:
      listed_stems: [丙, 壬]
      raw_excerpt: "十二月癸水，寒极成冰，万物不能舒泰，宜丙火解冻，"
      source_ref: "sources/ziping/穷通宝鉴-明-余春台_part2.md:662-663"
