conclusion_template: 子平原局官杀职业路径存在食伤介入，且结构必要门成立，支持职业角色或职责路径具有变化倾向；本结论不判断事件必然发生与具体年份。
confidence_basis: 官杀路径锚点、食伤介入与格局方向共同成立；财印护官与格局反向证据会阻止发布。
falsifier: 若按同一事实口径复核不存在官杀锚点或食伤介入，或可核验职业历程长期无角色与职责变化，则本结构命题证伪或降权。
