  - id: M2-Y-395
    school: yang
    domain: 婚姻
    statement: 夫妻宫被冲，谁制谁定婚姻好坏
    source_ref: {path: sources/yang/MinerU_markdown_杨清娟盲派八字命理2018戊戌年1月广州班111页_2056036453193547776.md, line: 1492}
    source_quote: 夫妻宫被冲，看谁能制了谁，对方制了我的时候婚姻不好，我制了对方的时候好婚姻。
    falsifier: 夫妻宫被冲且我制对方但婚姻不好，则本条证伪
    compile_state: needs_human
    compile_note: 触发条件（夫妻宫被冲）可编译，但结论取决于「谁制谁」的方向判断，需人工裁决。T-143 只补 invalidators（记录成败条件），未改本条的 compile_state
    conditions_v2:
      framework_dependency: requires_pair
      pair_with: [M1-D-298]
      # 本条仍为 needs_human，故以下 invalidators 在机械层不参与求值（compile_claim 早退）；
      # 写入目的是把「我制了对方≠必然好婚姻」的失效条件显式留档，不留在散文里。
      invalidators:
        any:
          - atom: needs_judgment
            args:
              reason: >-
                「我制了对方」仍可能坏婚：日主身弱承载不住（杨清娟广州班:1529「夫妻感情好不等于不离婚，
                她承载不了，身太弱了」）；且刑坏未必等于离婚（同书:1697「刑坏戌中辛金不等于离婚」）。
                身强弱/承载能力属 compare 缺口，无原子可判，交 Agent。
      invalidator_evidence:
        - {path: sources/yang/MinerU_markdown_杨清娟盲派八字命理2018戊戌年1月广州班111页_2056036453193547776.md, line: 1529, quote: 夫妻感情好不等于不离婚，她承载不了，身太弱了}
        - {path: sources/yang/MinerU_markdown_杨清娟盲派八字命理2018戊戌年1月广州班111页_2056036453193547776.md, line: 1697, quote: 刑坏戌中辛金不等于离婚}

  - id: M2-Y-251
    school: yang
    domain: 事业
    statement: 食伤旺者倾向自由职业
