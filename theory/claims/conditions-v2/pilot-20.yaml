notes: |
  20 条真实断语的条件化试点（婚姻 / 学历 / 财富 / 健康 / 子女）。
  目的：验证契约 23 的 IR 能否表达真实断语，并量化「编译 / 求值 / 区分度 / 语义支持」。
  不是生产规则，不参与任何报告或路由；全部为 candidate（候选）。
  未编译的 8 条保留在库内，作为「原子表缺口」的证据。

