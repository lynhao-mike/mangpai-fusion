    conditions_v2: {framework_dependency: requires_school_frame, frame_atom: {atom: tiyong, args: {role: 用}}}

  - id: M1-D-009
    school: duan
    domain: 事业
    statement: 制用结构（体用相制）为最常见做功方式
    source_ref: {path: theory/raw/duan/promoted/m1-patterns.md, line: 42}
    source_quote: 八字通过体用与宾主之间制的关系，得到命主所用的东西。
    falsifier: 盘中有制用结构但该盘事业无相应表现，则本条证伪
    compile_state: compiled
    compile_note: T-143：原 partial 转 compiled。「制用结构存在」≠「做功成立」这一未量化子条件不再删掉，改为 needs_judgment 显式挂在 preconditions.all，机制上必然产出 needs_fact 交 Agent；facts 层仍只出候选（engine/facts/structure_check.py 明言「不计层数、不折算富贵」），「做功层数→富贵层级」所需的 zuogong_layers 原子仍缺，故未量化部分不得视作已成立
    conditions_v2:
      framework_dependency: requires_school_frame
      frame_atom: {atom: tiyong, args: {role: 用}}
      time_window: natal
      preconditions:
        all:
          - atom: zuogong
            args: {kind: 制用}
          - atom: needs_judgment
            args:
              reason: >-
                「有制用结构」到「做功成立」之间还缺：制得住/制不住（力量相当）、是功神还是废神、
                功的层数（zuogong_layers / zuogong_success 原子均不存在）。契约 23 §6.3 已把
                compare 列为未实现缺口，此处不编造阈值，交 Agent 裁决。
      invalidators:
        any:
          - atom: needs_judgment
            args:
              reason: >-
                制用成立但「制不住」→ 不作功：婚姻专辑:64「原局水火之力量相当…夫宫就制不住夫星了」、
                大连面授讲义:701「如果制不住官杀，婚姻就不好了」。力量比较无原子，交 Agent。
      invalidator_evidence:
        - {path: sources/duan/MinerU_markdown_婚姻专辑_2056044010230448128.md, line: 64, quote: 此造坐支夫宫之伤官也欲制官星，但原局水火之力量相当，但行运入东方，泄子水又生助巳午火，这样夫宫就制不住夫星了}
      unmapped_prose: ""
      note: 「占八字的大多数（80%）」是频率陈述而非条件，未编译

  - id: M1-D-013
    school: duan
    domain: 财富
    statement: 墓用结构（入墓即得到/控制）
    source_ref: {path: theory/raw/duan/promoted/m1-patterns.md, line: 46}
    source_quote: 入墓也是一种做功方式，墓可以理解成得到、控制、管理、拥有、占据。
    falsifier: 盘中有墓用结构但无相应控制/占有事实，则本条证伪
    compile_state: compiled
    compile_note: T-143：原 partial 转 compiled。「入墓是否等于得到/控制」这一未量化子条件改为 needs_judgment 显式挂在 preconditions.all（必然 needs_fact），不再删掉当 compiled 跑；所需 zuogong_success 原子仍缺
    conditions_v2:
      framework_dependency: requires_school_frame
      frame_atom: {atom: tiyong, args: {role: 用}}
      time_window: natal
      preconditions:
        all:
          - atom: zuogong
            args: {kind: 墓用}
          - atom: needs_judgment
            args:
              reason: >-
                入墓是否等于「得到/控制/拥有」，须另证：宾主方位（墓在谁宫）与库是否被冲开
                （原文口径「冲为库活、不冲为墓死」）。缺 zuogong_success / 库开合的成败原子，交 Agent 裁决。
      invalidators: {any: []}
      unmapped_prose: ""

  - id: M1-D-242
    school: duan
    domain: 学历
    statement: 印星做功，学历较高
    source_ref: {path: theory/raw/duan/promoted/m1-practice.md, line: 16}
