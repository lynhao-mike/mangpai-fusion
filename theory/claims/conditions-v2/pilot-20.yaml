        not_found：反例分支「印虚透不做功→有文化但非高学历」目前只有库内摘要（theory/raw/duan/promoted/m1-practice.md:16
        的 rule 名「印星做功=有学历/不做功=懒笨」），未在 sources/duan 原文找到逐字对应句，故不写入 invalidators（不编造）。
