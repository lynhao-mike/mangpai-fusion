  - id: M1-D-298
    school: duan
    domain: 婚姻
    statement: 夫妻宫为用且不受刑冲穿破合，婚姻较好
    source_ref: {path: sources/duan/MinerU_markdown_婚姻专辑_2056044010230448128.md, line: 48}
    source_quote: 夫妻宫位要安静，如有用，不能被刑坏，冲破，穿倒，或六合，暗合他星。
    falsifier: 夫妻宫为用且安静但婚姻破裂，则本条证伪
    compile_state: compiled
    source_refs:
      - {path: sources/duan/MinerU_markdown_婚姻专辑_2056044010230448128.md, line: 48, role: 主锚点·安静/有用/合他星, quote: 夫妻宫位要安静，如有用，不能被刑坏，冲破，穿倒，或六合，暗合他星（配偶星以外的星），也不宜杂透，多现。}
      - {path: sources/duan/MinerU_markdown_婚姻专辑_2056044010230448128.md, line: 58, role: 标杆盘·夫宫为喜，冲去夫星忌神, quote: 伤官亥冲巳，夫宫为喜，冲去夫星忌神}
      - {path: sources/duan/MinerU_markdown_婚姻专辑_2056044010230448128.md, line: 70, role: 夫星合到夫宫＝好婚姻（合他星要排除配偶星）, quote: 寅丑暗合，夫星合到夫宫}
      - {path: sources/duan/MinerU_markdown_21.大连段建业-面授讲义（合集）134页_2056045222002622464.md, line: 4109, role: 夫妻宫「用」＝财官食伤；制不住为坏婚姻, quote: 坐下为用（财官食伤）就不好}
      - {path: sources/duan/MinerU_markdown_21.大连段建业-面授讲义（合集）134页_2056045222002622464.md, line: 701, role: 夫妻宫制去夫妻星＝好婚姻，制死才好, quote: 如果制不死，就是坏婚姻。}
    synthesis_note: >-
      T-143 依 ADR-007 D11 升为多锚点：主句取 48 行；「用」的取值域取 4109 ⑨「坐下为用（财官食伤）」；
      「制得死才算好」取 701 行；「配偶星本星相合不算坏」取 48 行括号自注 + 70 行实例；标杆盘取 58 行。
    conditions_v2:
      framework_dependency: requires_school_frame
      # 「夫妻宫有用」≠「日支本气是财官」。事实层 structure_check.tiyong_of 把食伤标双属
      # （食神偏体、伤官偏用，不替调用方强择），而 4109 ⑨ 在夫妻宫语境下把「用」定义为财官食伤，
      # 故 用/双属 均为「有用」，只有 体（印禄比）不是。标杆盘日支亥为伤官(双属)，原文判「夫宫为喜」。
      frame_atom:
        any:
          - {atom: tiyong, args: {role: 用, at: D.b}}
          - {atom: tiyong, args: {role: 双属, at: D.b}}
      time_window: natal
      preconditions:
        all:
          # ① 穿/破：4109 ②「穿了夫妻宫…婚姻不好」「夫妻宫穿了夫妻星的那个字，必离婚」——两个方向都坏，
          #    无需方向判断，作硬约束。
          - not:
              any:
                - {atom: chuan_at, args: {at: D.b}}
                - {atom: po_at, args: {at: D.b}}
          # ② 合：48 行括号自注「配偶星以外的星」，故排除配偶星本星；
          #    夫星合到夫宫是好事（70 行「寅丑暗合，夫星合到夫宫…一生好婚姻」）。
          - not:
              atom: he_at
              args: {at: D.b, exclude_god: 配偶星}
          # ③ 冲/刑：既可能是「夫妻宫被坏」，也可能是「夫妻宫制去夫妻星」（58/701/4109①）。
          #    关系边无向，机械层判不了方向与「制死」与否，故走 needs_judgment 推给 Agent。
          - any:
              - all:
                  - not: {atom: chong_at, args: {at: D.b}}
                  - not: {atom: xing_at, args: {at: D.b}}
              - all:
                  - {atom: zuogong, args: {kind: 制用, involves: 配偶星}}
                  - atom: needs_judgment
                    args:
                      reason: >-
                        夫妻宫涉冲/刑时须判「夫妻宫被坏」还是「夫妻宫制去夫妻星」，以及是否制死
                        （大连面授讲义:701「如果制不死，就是坏婚姻。如果此造改为申年，制不住官杀，
                        婚姻就不好了。」、4109①）；关系边无向，机械层判不了。
      invalidators:
        any:
          # 反条件：配偶星既不透也不藏 → 无婚或克配偶，本条（婚姻较好）不成立。
          - all:
              - not: {atom: visible_god, args: {god: 配偶星}}
              - not: {atom: hidden_god, args: {god: 配偶星}}
          # 反条件（待判）：夫妻宫虽有用且安静，但夫妻星「制不死」→ 坏婚姻。
          - atom: needs_judgment
            args:
              reason: >-
                夫妻宫制夫妻星是否「制死」（力量比较）；大连面授讲义:701「如果制不死，就是坏婚姻」。
                契约 23 §6.3 列 compare 为未实现缺口，此处不编造阈值。
      invalidator_evidence:
        - {path: sources/duan/MinerU_markdown_婚姻专辑_2056044010230448128.md, line: 17, quote: 如无则另看：男命再无遁藏，基本可能确定无婚，或克配偶。}
        - {path: sources/duan/MinerU_markdown_21.大连段建业-面授讲义（合集）134页_2056045222002622464.md, line: 701, quote: 如果制不死，就是坏婚姻。如果此造改为申年，制不住官杀，婚姻就不好了。}
      unmapped_prose: ""

  - id: M1-D-341
    school: duan
