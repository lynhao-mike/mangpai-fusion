    topic_label: "牢狱判定完整体系 (M3-R-171..175)"
    title: "牢狱命四大组合"
    conclusion: "**规则**：命犯牢狱的四种核心组合： 1. **阴坏阳**：辰/丑晦火（午火被辰丑包围制住）→必犯牢灾 2. **官方包局**：表示法律执法或官方的字（申/酉/辰/丑）围住阳→被官方制 3. **食伤入墓/坏食伤**：食表自由，入墓或被坏→失去自由→牢狱 4. **制字被保护**：原局要制的字反被辰/丑/申/酉联手保护→命犯牢灾  **来源**：牢狱篇·总论四条"
    status: promoted
