    conclusion: "**规则**：食神入墓→寿到（食表自由/生命力，入墓则无）。印星被坏→寿到（印为生命原神）。干透双枭+食透干被夺→运行食到+流年枭夺食→病亡。活木日主怕坏印星→双壬坐绝/被合坏→短寿。  **来源**：寿命篇·甲丁己丁例（枭夺食亡于肺）+ 丁壬乙壬例（坏印短寿）"
