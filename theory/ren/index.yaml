    topic_label: "六亲判定完整体系 (M3-R-141..150)"
    title: "克子女判定法（六亲篇系统）"
    conclusion: "**规则**： - 命中无食伤看子女→财星加官杀看（只生男不生女） - 食伤入墓而墓不开→不会生育 - 庚坐子与日支卯破→非血缘象→抱养 - 戊看儿被乙克+戊坐申入丑墓+子合闭丑墓→儿出不来→不生儿 - 丑午穿→生女不生男 - 时上酉透丁+壬合+酉戌穿→女儿非亲生为抱养  **来源**：六亲篇·辛酉/庚子/己卯/戊辰例（试管婴儿）+ 戊申/乙丑/壬午/壬子例"
