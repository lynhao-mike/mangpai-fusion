    conclusion: "**规则**：通过取象读出具体数字（人数/年数/金额）： - 命中儿女数：根据子女星的干支象组合取数（四男两女等具体数字） - 牢灾刑期取数：根据官杀/食伤/墓库组合定刑年数 - 减刑层级：命中有贵人→可有减刑机会→每次减到具体数字 - 花费金额：根据力量大小定所需花费（30万/40万等）  **示例**：辛辛己甲（丑卯亥子）命→断六个儿女四男两女（全国大会无人答对）。癸乙己庚（卯卯酉午）命→断9年刑→三次减至缓2年→实际判缓2年释放。  **来源**：神煞篇·象法取数 + 牢灾取数 + 活取用神断六亲"
