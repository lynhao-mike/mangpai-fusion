    conclusion: "**规则**： > 歌诀：一字重现叫伏吟，命占伏吟定双姓。  某干支在不同宫位重复出现为伏吟。伏吟表示该字所代表类象的移动移位： - 年柱伏吟到时柱→爷爷/父亲曾迁移过 - 年柱伏吟→父亲双姓（过门/抱养） - 子水年支伏吟到时支→祖母嫁两家（移位从一家到另一家） - 戊土伏吟→祖父过房寄养为双姓  **区分**：阳干伏吟主\"养子/过继\"（占有性）；阴支伏吟主\"嫁两家\"（移动性）。  **来源**：神煞篇·伏吟用法 + 甲庚戊甲例 + 戊丁辛戊例"
