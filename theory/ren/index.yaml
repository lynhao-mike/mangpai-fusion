  - id: M3-R-154
    school: ren
    topic: hunyin
    topic_label: "婚姻判定完整体系 (M3-R-151..162)"
    title: "多婚/离婚核心条件"
    conclusion: "**规则**：离婚六种情况： 1. 夫妻宫穿了夫妻星→必离或配偶死亡 2. 宫多现+星多现→多数离婚 3. 宫落星得位时被他合（六合/暗合）→合走→离婚 4. 比劫争夫/妻+配偶宫被坏→必离 5. 正星受制→婚姻出问题（偏星可制，正星不可制） 6. 因宫坏离婚→坏宫之物有几个就几次婚；因星多离婚→几个星就几次婚  **来源**：婚姻篇·多婚姻的组合"
