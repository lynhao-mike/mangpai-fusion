    school: ren
    topic: hunyin
    topic_label: "婚姻判定完整体系 (M3-R-151..162)"
    title: "不稳定婚姻判定法"
    conclusion: "**规则**： 1. 宫有用却被刑冲破穿/六合暗合他星/杂透多现→不稳定 2. 宫是忌神无制或作用被坏→配偶不帮/感情差 3. 比劫争夫/争妻→轻则第三者，重则离婚 - 宫星相破（如卯午破）→夫妻不和常吵但不离 - 宫伏吟+妻星多→有情人但离不了  **来源**：婚姻篇·不稳定婚姻的组合"
