  - id: M3-R-149
    school: ren
    topic: liuqin
    topic_label: "六亲判定完整体系 (M3-R-141..150)"
    title: "祖辈/四代贵命判定法"
    conclusion: "**规则**：命主活木火通年时→一家人贵（从祖辈到自身都有官贵）。年柱看祖辈→年上有官杀库/印库做功→爷爷当官。月令看父母→月有官杀制→父母有权。日时看自身→自身官杀做功→本人当官。一家当官命的核心是木火相生贯通四柱。  **来源**：六亲篇·戊午/甲寅/甲辰/甲戌例（爷爷县委书记/父亲县长/母亲法院副院长/本人副检察长）"
