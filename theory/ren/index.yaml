    topic: hunyin
    topic_label: "婚姻判定完整体系 (M3-R-151..162)"
    title: "好婚姻核心条件"
    conclusion: "**规则**：以配偶宫为主，配偶星为辅。好婚姻三条件： 1. 宫位安静——不被刑冲破穿坏，不六合/暗合他星，不杂透多现 2. 宫制星——男命比劫能制财，女命伤官能制官（制住则好，制不住则坏） 3. 忌星被制——原局官为忌被星制之吉者，婚姻好  **来源**：婚姻篇·好婚姻的组合"
