  - id: M3-R-170
    school: ren
    topic: jiankang
    topic_label: "寿元判定完整体系 (M3-R-163..170)"
    title: "凶亡/正常死亡区分法"
    conclusion: "**规则**： - 时透杀克日主→遭凶亡（被杀/车祸等） - 全局火势+死木+杀运→被人杀害 - 禄入墓+冲墓→心梗猝死（突发） - 巳被申合+丑拱+辰晦→被水淹死 - 食伤入墓被坏→牢中死/病亡 - 正常病亡：寿星缓慢被运年制服→疾病渐重而终  **来源**：寿命篇·丁丙乙辛例（被杀）+ 乙甲辛壬例（溺亡）+ 癸壬丙乙例（脑瘤）"
