    conclusion: "**规则**：凡通过食伤做功或财星做功的类型，适合经营取财。地支食神做功者适合做企业经营。坐下食神有功→做企业。食伤带了官的象（如辛巳自合）→非本人企业而是企业管理者。食神可表财原也表才智。  **来源**：财运篇·取财方法第1条"
