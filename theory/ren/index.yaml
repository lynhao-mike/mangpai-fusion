    title: "寿星取用总则"
    conclusion: "**规则**：四种取寿方式： 1. **阴阳**：阴坏阳或阳坏阴→寿短象 2. **五行**：各五行代表自身寿命因素不同（水通根怕绝、死木怕火焚、金怕入墓被坏） 3. **十神**：食/财/印可看寿，有时比劫羊刃也可 4. **禄**：禄表身体，可当寿看  取命中最关键的字（被破坏状态的字）为寿星；大运再对此字不利+流年引发→应凶。  **来源**：寿命篇·总论"
