    conclusion: "**规则**：从命中看兄弟姐妹数量需综合：比劫数量+食伤数量+宫位组合+藏干。命中无比劫星也可通过其他十神的组合看出兄弟数。同父异母的姐妹通过藏干不同根源区分。四代人（爷奶/父母/自身/儿女）信息在命中都有显现。  **来源**：六亲篇·丙辰/癸巳/辛亥/癸巳例（兄妹7-8个）"
