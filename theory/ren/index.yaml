    conclusion: "**规则**：活木坐辰+时见禄透丙→命必高寿。食神有根+日支拱食→生命力极强→长寿。己日主月见酉食+日支丑拱酉→寿增强→可达百岁以上。寿星有根有力不被破坏→高寿。大运透印见墓→寿到（即使高寿也有终期）。  **来源**：寿命篇·己甲甲丙例（90岁）+ 己癸己丙例（108岁）"
