    conclusion: "**规则**： - 制财的原神做功者→大富（百万级起步），做功能量大者可达千万到亿级 - 财与原神同时被制→大财 - 官统财/财统官/官当财看→级别高 - 仅制局中财星→零花钱，小财 - 转换弯子越多→挣钱越多（工艺越复杂利润越大）  **来源**：财运篇·提示 + 实战技巧·十神互换替代法"
