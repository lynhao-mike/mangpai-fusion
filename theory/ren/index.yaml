    conclusion: "**规则**： > 歌诀：亡神劫煞犯官符，合克身命遭砍头。  亡神、劫煞为凶煞，当其同时犯到命中且合克身命时→犯死罪/极刑。用法： 1. 查亡神劫煞是否入命 2. 看是否合克日主/身命 3. 大运流年引动→凶灾应期  **示例**：癸甲乙戊（巳寅卯寅）命→犯亡神劫煞+官符→戊申运癸巳年→公交纵火案→烧死。  **来源**：神煞篇·亡神劫煞用法 + 陈水总例"
