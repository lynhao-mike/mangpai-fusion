    conclusion: "**规则**： > 歌诀：合墓之象终为凶，飞来横祸入墓中，生有时死有地，酉辰相合死水里。  用法： 1. 日主坐禄/帝旺为一体 2. 命中出现日主之墓库包住自己→寿不长 3. 运行至墓库之运/年→应凶 4. 辛酉入辰墓→年时双辰包住→运至辰+流年辰→入墓凶亡 5. \"酉辰相合死水里\"→辛酉见辰合→死于水中  **示例**：丙庚辛壬（辰子酉辰）命→辛酉坐禄，年时双辰为墓→被墓包→壬辰年寿到→死于水中（河边找到车，人失踪）。  **来源**：神煞篇·十二长生法 + 丙庚辛壬例"
