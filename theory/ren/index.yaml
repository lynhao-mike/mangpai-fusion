    conclusion: "**规则**：凡与日干或配偶宫有关系的星方可当配偶星看，无关系者只表婚前朋友。男命无财看食伤，女命无官看财或印。配偶星得正位（夫/妻星在夫/妻宫）最吉，如寅丑暗合（夫星合到夫宫）→夫只和自己好。  **来源**：婚姻篇·基本原则 + 癸/丙/己/丙例"
