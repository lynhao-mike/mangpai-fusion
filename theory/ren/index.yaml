    conclusion: "**规则**： > 歌诀：要知自缢最凶神，戌巳亥辰并未寅，大忌空亡兼墓鬼，官符大耗仍需避，五行若更来克身，一死悬梁一水中。  此煞又叫自缢煞，民间定为破身凶亡煞。犯之者非正常死亡，现代社会可定为车祸凶亡。判定： 1. 命中有戌巳亥辰未寅的特定组合 2. 又犯空亡+墓鬼 3. 亥入辰、寅入未→定凶死之兆→车祸/溺水  **示例**：癸甲壬丁（亥寅辰未）命→犯四大空亡+破身凶亡煞→亥入辰、寅入未→三十岁壬辰年车祸死亡。  **来源**：神煞篇·破身凶亡煞 + 癸甲壬丁例"
