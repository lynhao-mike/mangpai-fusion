    conclusion: "**规则**： > 歌诀：将军箭似一杆枪，十个逢之九个亡。 > 酉戌辰时春不旺，未卯子时夏中伤。 > 午寅丑时秋更忌，冬季申亥巳为殃。 > 一箭伤人三岁死，两箭伤人六岁亡。 > 犯了三箭防九岁，不死自己损爹娘。  判定步骤： 1. 按出生季节+时辰查是否犯将军箭 2. 有箭要有弓，箭分偏正 3. 犯箭数量定夭亡年龄（一箭三岁，两箭六岁，三箭九岁） 4. 命犯此煞要提前禳解  **示例**：戊乙癸庚（寅丑酉申）命→冬季生，申时犯煞→两箭→六岁亡→癸未年夭。  **来源**：神煞篇·将军箭煞 + 师父断命例"
