    title: "六亲宫位与十神定位总则"
    conclusion: "**规则**： - 宫位：年柱→祖辈/父母/远戚；月柱→父母/兄弟/姐妹；日支→配偶；时柱→儿女 - 父亲取星：官杀、财星、刃、印星 - 母亲取星：食伤、禄、比劫 - 配偶(男)：财、食伤、禄；配偶(女)：官杀、财、印、刃 - 儿子(男)：杀、财、官；女儿(男)：官杀、财星、食伤 - 通则：杀加财生儿，杀无财生女，穿了财生女 - 十神可互换替代，针对不同组合取六亲可相互替代  **来源**：六亲篇·宫位具体定六亲 + 各十神代表的六亲定位"
