    conclusion: "**规则**： - 癸亥看父，癸亥与年上戊合+亥入年上辰墓→父与别人过而不与自己生活→父母离异 - 戊午看父，戊先与年癸合+午与年未合→父曾与别人生活过（父离过婚） - 年上丙为父合别星（丙辛合）→父有外遇→父母离婚 - 随母改嫁标志：丑食看母+伏吟+丁丑一柱  **来源**：六亲篇·戊辰/癸亥/戊寅/丁卯例 + 癸未/戊午/癸丑/癸亥例"
