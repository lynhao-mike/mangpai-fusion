    conclusion: "对命局进行全面分析、判断人生各方面事项时 conclusion: 宫位7层类象(每柱同时具备7层含义)： ① 六亲：年=祖/父母/外戚；月=父母/兄弟/同事；日支=配偶；时=子女/晚辈 ② 时间：年=1-18岁；月=18-35岁；日支=35-55岁；时=55+岁 ③ 空间：年=远方；月=祖籍；日支=现居；时=门户/出门 ④ 身体：年=腿足四肢；月=躯干脊肩背；日支=五脏六府心脑髓；时=头面手眼耳鼻生殖 ⑤ 物品：年=鞋/拐杖/别人之物；月=祖产/家业/单位/学业；日支=房子/卧室/私产；时=车/门/衣帽/眼镜/进出之钱 ⑥ 情感：影响vs被影响的方向(年月→日支/日支→时) ⑦ 表理：天干=表象(外表/性格)；地支=内在(内心/家人关系/隐蔽) 核心：同一宫位可以同时读多层——具体取哪层由问题决定。 falsifiable_by: 按宫位7层推断，实际某层完全不符"
