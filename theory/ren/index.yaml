    conclusion: "**规则**：用民间口诀一句定职业，不需复杂推理： - \"戊临戌酉做先生\"→戊日主坐戌或酉→教师/先生 - \"月令正官合日宫，坐堂招婿来传宗\"→月令正官合日支→倒插门女婿  特点：一句歌诀定一生职业或婚姻格局，与五行生克推理无关，属师传心授秘诀。  **示例**：壬癸戊辛（戌丑午酉）坤命→戊临戌酉→教师→实际为优秀教师。戊乙壬辛（戌丑子丑）坤命→月令乙丑正官合日宫→倒插门→盲人断其丈夫为入赘。  **来源**：神煞篇·职业歌诀 + 婚姻歌诀"
