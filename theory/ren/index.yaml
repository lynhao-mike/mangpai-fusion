    title: "寿元歌综合定寿法"
    conclusion: "**规则**： > 歌诀（节选）：八字看寿有多端，祖师另加生死诀，门中学子细细参，歌诀铭记不轻传。年时数排半花甲，三十岁年阴阳隔。头重尾轻犯夭煞，求神拜佛世无药。XX合绝衣食浅，中年要防命归天。  原则： 1. \"年时数排半花甲\"→年柱时柱纳音数相排定寿限 2. \"头重尾轻犯夭煞\"→年月重时柱轻→夭折象 3. \"三十岁年阴阳隔\"→年时数为三十→三十岁阴阳分离 4. \"XX合绝\"→特定干合见绝地→中年防命归天  看八字非单用生克冲合等作用方式可解释，需结合寿元歌等神煞秘诀综合定数。  **来源**：神煞篇·寿元歌节选"
    status: promoted
