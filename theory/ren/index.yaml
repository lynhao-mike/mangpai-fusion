    conclusion: "判断婚姻是否必定离异时 conclusion: 必离婚的6种触发器： 1. 宫穿星——夫妻宫穿了夫妻星那个字 → 必离/配偶死亡 2. 宫多现+星多现——双宫双星 → 多数离 3. 宫落星时逢他合——六合/暗合走 → 离(合走了) 4. 比劫争+配偶宫被坏——有第三者+宫坏 → 必离 5. 正星得位时受制——正星不可制，制则婚出问题 6. 婚次数判定——坏宫的东西有几个=几次婚；星多现几个=几次婚 女命特则：原局财弱+运年制服财星 → 必离。 falsifiable_by: 满足触发器判为必离，实际白头到老"
