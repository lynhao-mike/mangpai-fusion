  - id: M3-R-155
    school: ren
    topic: hunyin
    topic_label: "婚姻判定完整体系 (M3-R-151..162)"
    title: "结婚应期判定法（婚姻篇系统）"
    conclusion: "**规则**： - **逢合看冲**：宫逢合时，流年冲开→成婚（如午未合遇丙子年冲解合成婚） - **逢冲看合**：宫无合时，流年冲动夫妻宫→成婚 - **冲逢合**：星冲宫表妻/夫要入位，逢流年合即留→成婚 - **三合入宫**：大运原有星与宫半合，逢流年三合局则婚 - **太岁合星**：配偶星逢太岁合入日主或它干→成婚 - 需结合地域风俗，年月见星主早，时日相对晚  **来源**：婚姻篇·看结婚时间"
