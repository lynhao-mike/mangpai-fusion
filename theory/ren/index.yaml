  - id: M3-R-200
    school: ren
    topic: shensha
    topic_label: "神煞/伏吟/空亡深化 + 综合断法 (M3-R-187..200)"
    title: "化解总论"
    conclusion: "**规则**：化解非改变命运，而是趋吉避凶： 1. **原理**：万物一生一克，有病就有去病之物（除气终外）。借天地之力行事，找到对应物质化解不顺。 2. **命运+风水结合**：八字定凶信息随身不变，风水常换。唯命运与风水结合→化解正确途径。 3. **限度**：化解不可改变气数已尽之事，只能在定数范围内趋吉避凶。如天要下雨不能改，但带伞可免淋→化解。 4. **方法总纲**：催、改、补、泄、调、鼓、作、制、拉、造、就地取材（十四字诀）。 5. **德行**：化解是违背自然平衡法则→修习化解必重德。以小人之心行事→伤己伤后人。  **实操要点**： - 择日时+定方位+用特定物质（如河石/清水/中药/煤球/鸡骨头花椒等） - 根据八字/卦象确定用什么物质对应什么病灾 - 催财/解官灾/治病皆可用，但不能无罪释放（命中无此信息则不可逆转）  **来源**：神煞篇·关于化解 + 酒店河石例 + 官灾中药例 + 卦中催力例"
    status: promoted
    layer: unmapped
    raw_source: "任派 m3-rules-registry"
