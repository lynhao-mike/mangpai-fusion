    conclusion: "**规则**：日主通根怕流绝——水通根在年月见源，时见绝地→寿不长。行运到绝地被引发→亡。甲辰日主年见辰根+时见寅绝→短寿。壬子运水得根→暂安，流年引动绝→亡。  **来源**：寿命篇·甲丁癸甲例（水见绝）+ 丁壬癸甲例（禄到应绝）"
