    conclusion: "**规则**：命中有某脏腑受损信号且对应六亲星同样受损→遗传病。心血病看午火/丁火受损是否涉及父星母星→判断是否遗传。爷爷死于心血病+父有心血病+命主也有信号→家族遗传心血病。肺病看金受损+对应奶奶星→奶奶因肺病死。  **来源**：六亲篇·乙丑/丙戌/癸未/庚申例（四代心血病遗传）"
