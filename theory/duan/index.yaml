    conclusion: "> 「指地支六合、暗合、半合局的制法。」 > > **本讲义中的类型比较**（不是跨命局、跨制法的统一效率表）： > 1. **巳申合最高**：「既可以金水有势，申制巳，也可以木火有势巳制申，都是将原神用神全能制死。」 > 2. **卯戌、卯申、午亥次之** > 3. **巳酉半合（火旺时）** > 4. **子丑、寅丑略差** > 5. **寅亥、辰酉、午戌效率较低** > 6. **卯未/亥未半合（制未时）效率相对低** > 7. **午未合不制，仅相生**  这些比较应按原文各自附带的结构条件使用，不推出一个脱离党势、位置、强弱和作用方向的 跨命局固定排名。合本身还可合绊、保护、闭气或改变作用方向，不能仅凭合名断为制。"
