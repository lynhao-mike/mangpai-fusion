    title: "做功 4 — 合用结构"
    conclusion: "> 「日主或日支为'体'，合住宾位的'用'，这类为合用结构。日主合，要么合财要么合官；日支逢六合，可合财、合官、合伤食，所合的东西就是日主所追求的。」 > > 「**注意：合财的时候要看身强身弱**。合财就象背一个包袱，身强可以胜财，身弱就不能胜财。具体有以下几种情况： > A、身旺财旺，合财可发大财； > B、身弱财旺，合财肯定是穷人； > C、身旺财弱，合财不穷，有钱花，一般人而已； > D、身弱财弱，合财也有财，但不会是大财，不缺吃喝而已。」  → 这 4 种合财配置的原文表述比 module-1-duan §6.1 更细，应回灌入 M1-D-012 conclusion 字段。"
