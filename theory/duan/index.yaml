  - id: M1-D-005
    school: duan
    topic: lifa
    topic_label: "体用"
    title: "体的分类 — 工具（日干/比劫/印/禄/刃）"
    conclusion: "> 「宾主概念是从宫位角度分'自我主体'与'外物客体'；体用概念是从十神角度分'自我主体'与'外物客体'，即我们把八字中的十个神分为'体'和'用'。」 > > 「**体是什么？体是我自己以及我使用的工具，或者说我操纵的工具**，就象你干活的时候总得拿个工具才行，比如日主、印、禄都是体。」 > > 「**那么用是什么？用是我的目的、我的追求**，也就是我要得到的东西，比如财、官是用，是我们追求的东西。需要注意的是，这个'用'与传统命理中的用神是有区别的。」 > > 「我们把日主、印星、禄神、比劫当体，财星、官杀星当用，**食神与伤官既可以是体，也可以是用**，因为食神、伤官属于人精神体验的范畴，有智力、思想、快乐、享受、财富等意思，既是属于我们本身，又可以成为我们追求的东西。根据命局不同的情况，它们既可以当体，也可以当用。如一定区分它们，则**食神更近于体，伤官则接近于用**。」  → **关键论断**：体用之\"用\"≠ 子平传统\"用神\"。这是 M1 与 M2/M3 划清界限的核心。"
    status: promoted
