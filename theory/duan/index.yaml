    topic: lifa
    topic_label: "做功"
    title: "做功 5 — 墓用结构 + 富贵=势+功"
    conclusion: "> 「入墓也是一种做功方式，墓这里可以理解成得到、控制、管理、拥有、占据等含义。」 > > 墓用做功方式：**冲为库，活的；不冲不刑是墓，死的。** > > 墓用 4 大原则： > 1. 寅、申、巳、亥四大长生点，见其各自的墓库为入墓 > 2. 子、午、卯、酉见其墓一般不作入墓看，当拱局看，只有其极弱（无生无助）的情况下，见墓才入 > 3. 多而墓之，即只要是天干地支合在一起，有两个或两个以上，见墓即入 > 4. 天干坐墓，不以入墓看 > 5. 辰为水墓也为土墓；丑入辰墓，未也入辰墓；但当丑未辰都出现时，丑未因冲的关系，不入辰墓"
