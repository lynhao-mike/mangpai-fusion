    title: "宾主第 1 层 — 日干 vs 其它 7 字"
    conclusion: "> 「这个概念在盲派命理中有特殊的意义。 宾主就是告诉我们什么东西是 自 己的，什么东西是别人的。」 > > 「中国的许多预测术都讲'宾主'，六爻卦中讲：世爻为主，应爻为宾；卦中之爻为主，日月及变爻为宾；风水、奇门、六壬、梅花易数等都讲'宾主'，只不过他们用的可能是'主客'、'体用'、'天地人'等不同的概念，但所要表达的都是'自我主体'与'外物客体'的关系。其实我们的人生也是这样，通过我与外部世界发生的一切关系与关联，构成我们的人生命运。」 > > 「比如说你要当官还是要发财，就看财、官在八字中的哪个位置，如果财、官在主位，就是我的财、官；要是财、官在宾位，就是别人的财、官。这样定位之后，再看主与宾的作用关系，通过作用关系，搞清楚财官是否与我有关联，能否成为我的。这样你就会明白，**看八字其实与日主的衰旺没有什么太大的关系，只有在宾与主的关系中，也就是一个人的社会交往中，体现他的能力大小以及富贵贫贱**。」  → **关键论断**：\"衰旺没有太大关系，宾与主的关系才决定富贵贫贱\"是段派对子平传统的最大颠覆。"
    status: promoted
