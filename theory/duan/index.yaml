    conclusion: "大运/流年某柱与原局某柱（或原局两柱之间）干支完全相同 → 形成伏吟 prerequisites=识别伏吟柱的位置（年/月/日/时 → 对应 父母宫/事业宫/夫妻宫/子女宫/门户） 识别伏吟柱的十神性质（喜/忌/用/闲） 识别伏吟柱与原局其它柱的作用关系（是否被冲/合/破伏吟） conclusion: - 伏吟 = \"同神再现\"导致语义分裂 — 同时是吉是凶取决于神性 + 位置 1. **外出**（伏吟门户柱 = 月柱 / 时柱）— 1 人变 2 人之意 2. **内调工作 / 学术喜事**（伏吟印星 / 食神喜神）— 一物变两物 3. **借出去钱**（伏吟财星忌神）— 钱分两份借给人 4. **结婚 / 怀孕生育**（伏吟夫妻宫 / 子女宫 / 子女星 + 命局动象）— 一变二 5. **痛苦**（伏吟忌神 / 七杀库）— 欲把自己分两半 / 伏在床上哭泣 6. **失去 / 走了又回**（伏吟父母 / 配偶星被坏）— 分离 / 反复 - 铁律：伏吟非吉非凶，**5+ 种讲法可同时存在**，全部按当年实际验证（D-06 段建业自批\"丁丑年时柱伏吟 5 讲法验证 4 条\" line 569） - 应期机制：伏吟柱本身不主吉凶，伏吟是\"应期触发器\"，吉凶看伏吟柱的神性与原局做功 falsifiable_by: - 6 类讲法的\"哪一类应验\"事先难判定 — 实战需结合大运状态 + 流年其它字综合判断 - 时柱与年柱的伏吟（如太岁与时柱完全相同）vs 大运与原局某柱伏吟，应期力度不同 — 待补判"
