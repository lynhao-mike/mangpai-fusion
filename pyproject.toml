# ============================================================
# pyproject.toml · v1.2 最小 pytest 配置
# ============================================================
# Track-H 在 W2 阶段建立的 pytest 最小配置。
# 仅含 [tool.pytest.ini_options]，不引入 build system 配置（v1.2 暂不打包）。
# ============================================================

[tool.pytest.ini_options]
minversion = "7.0"
# 日常 pytest 只跑有效事实层套件。旧实验/回测目录用 --ignore 隔离；
# 显式指定路径时请加 `-o addopts="-ra --tb=short"` 以覆盖 ignore。
testpaths = [
    "tests/facts",
    "tests/api",
    "tests/predicates",
    "tests/tools/test_query_theory.py",
    "tests/tools/test_human_touch_linter.py",
    "tests/tools/test_blind_ledger.py",
    "tests/tools/test_anchor_span.py",
    "tests/tools/test_blind_toolchain.py",
    "tests/tools/test_gao_split.py",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--ignore=tests/evaluation",
    "--ignore=tests/asof",
    "--ignore=tests/r10",
    "--ignore=tests/v1_3_acceptance",
    "--ignore=tests/v5",
]
markers = [
    "regression: 整合回归测试（Track-H 维护）",
    "smoke: 各 track 自带 smoke",
    "v1_2_gate: v1.2 发布门槛断言（决策 I）",
    "needs_engine_b: 需要 Track-B（杨派 D2）实现",
    "needs_engine_c: 需要 Track-C（任派 D3）实现",
    "needs_engine_d: 需要 Track-D（高派 D4）实现",
    "v1_3_acceptance: v1.3 验收门槛 H1-H6（plans/architecture-v1.3.md § 六）",
    "v1_4_acceptance: v1.4 验收门槛 H7-H11（plans/architecture-v1.4.md § 六 + 后续 W1 收编）",
]
filterwarnings = [
    # tools/feedback_loop.py 的 docstring 含 \d，是 docstring 而非 regex
    "ignore::DeprecationWarning:tools.feedback_loop",
]
