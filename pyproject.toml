# ============================================================
# pyproject.toml · v1.2 最小 pytest 配置
# ============================================================
# Track-H 在 W2 阶段建立的 pytest 最小配置。
# 仅含 [tool.pytest.ini_options]，不引入 build system 配置（v1.2 暂不打包）。
# ============================================================

[tool.pytest.ini_options]
minversion = "7.0"
# 日常 pytest 只跑与现行架构直接相关的套件。旧实验/回测目录用 --ignore 隔离；
# 显式指定路径时请加 `-o addopts="-ra --tb=short"` 以覆盖 ignore。
#
# T-144（ADR-007 D8 第一阶段）扩容：由 14 个路径扩到覆盖 claims / decision / application /
# features / tools 全量 / governance 绿集 / 根目录保护测试 / Track-E 负向自测门禁。
# 扩容时只收「本来就绿」的套件；以下 4 个治理层文件当前红，**未**纳入门禁，
# 原因与清单见 tasks/T-144/BRIEF.md「红灯清单」，由中枢决定修实现还是判测试过期：
#   tests/governance/test_school_registry.py          （frozen+slots 下 property 赋值抛 TypeError，需 CPython ≥3.13）
#   tests/governance/test_static_isolation.py         （ast.parse 遇 PEP 695，需 CPython ≥3.12）
#   tests/governance/test_structure_catalog.py        （同上）
#   tests/governance/test_structure_catalog_integrity.py（同上）
testpaths = [
    "tests/facts",
    "tests/api",
    "tests/predicates",
    "tests/claims",
    "tests/decision",
    "tests/application",
    "tests/features",
    "tests/tools",
    "tests/governance/test_arbitration_contract_boundaries.py",
    "tests/governance/test_arbitration_gate_contracts.py",
    "tests/governance/test_arbitration_gates.py",
    "tests/governance/test_arbitration_properties.py",
    "tests/governance/test_canonical.py",
    "tests/governance/test_composition_execution.py",
    "tests/governance/test_composition_registry.py",
    "tests/governance/test_fact_certification_registry.py",
    "tests/governance/test_fact_contracts.py",
    "tests/governance/test_governance_claim.py",
    "tests/governance/test_governance_claim_derivation.py",
    "tests/governance/test_trigger_registry.py",
    "tests/governance/test_v5_import_freeze.py",
    "tests/governance/test_wave1_baseline_contract.py",
    "tests/track_e_smoke/test_e_negatives_gate.py",
    "tests/test_production_entrypoints_unchanged.py",
    "tests/test_project_metadata.py",
    "tests/test_error_policy.py",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--ignore=tests/evaluation",
    "--ignore=tests/asof",
    "--ignore=tests/r10",
    "--ignore=tests/v1_3_acceptance",
    "--ignore=tests/v5",
]
markers = [
    "regression: 整合回归测试（Track-H 维护）",
    "smoke: 各 track 自带 smoke",
    "v1_2_gate: v1.2 发布门槛断言（决策 I）",
    "needs_engine_b: 需要 Track-B（杨派 D2）实现",
    "needs_engine_c: 需要 Track-C（任派 D3）实现",
    "needs_engine_d: 需要 Track-D（高派 D4）实现",
    "v1_3_acceptance: v1.3 验收门槛 H1-H6（plans/architecture-v1.3.md § 六）",
    "v1_4_acceptance: v1.4 验收门槛 H7-H11（plans/architecture-v1.4.md § 六 + 后续 W1 收编）",
]
filterwarnings = [
    # tools/feedback_loop.py 的 docstring 含 \d，是 docstring 而非 regex
    "ignore::DeprecationWarning:tools.feedback_loop",
]
