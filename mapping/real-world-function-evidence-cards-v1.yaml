  F12:
    function_id: F12
    label: 内容生产、传播与影响
    recovery_status: frozen_complete_recovered
    frozen_definition: F12 识别命主对可识别、已外化且可被他人理解或感知之内容／表达成果的直接生产或传播功能；生产以内容形成并完成外化为核心，传播以命主实施发布、呈现、播送、分发等动作并具有可识别受众或现实可达方向为核心；实际触达与内容影响仅作独立增强，不是基础成立条件。
    reality_objects:
      qualified: [identifiable_externalized_content_or_expression_understandable_or_perceptible_by_others]
      excluded: [thought, theme, material, data, blank_template, product_itself, unfinished_draft]
    reality_actions:
      production: [creation, writing, substantive_editing, recording, completed_production]
      dissemination: [publication, public_presentation, broadcasting, curatorial_display, audience_directed_distribution, attributable_retelling_or_commentary]
      excluded: [pure_copying, logistics_delivery, equipment_operation, platform_maintenance, typesetting_or_printing, product_sales, passive_interview_or_reporting_or_appearance, likes_or_bookmarks, private_forwarding]
    action_attribution:
      roles: [content_creator, content_editor, content_presenter, content_publisher_or_distributor, dissemination_organizer_or_manager]
      rule: 前三类及实际执行发布／分发者按各自动作过门；纯组织管理不自动成立；共同创作只按可核验个人贡献归属，团队成果不得整体归命主。
    necessary_reality_gates:
      production:
        - identifiable_content_or_expression
        - subject_creation_writing_substantive_editing_recording_or_completed_production
        - externalized_form_receivable_by_others
        - subject_attribution
      dissemination:
        - identifiable_content
        - subject_publication_presentation_broadcast_distribution_or_dissemination
        - identifiable_audience_or_realistic_reachability_direction
        - subject_attribution
      path_closure: either_path_independently_sufficient_for_base_F12
      publication_required_for_production: false
      actual_reach_required_for_base_F12: false
      influence_required_for_base_F12: false
    state_card:
      production:
        P0: no_evidence
        P1: single_or_stage_completion
        P2: repeated_but_unstable_production
        P3: sustained_stable_production
      dissemination:
        D0: no_evidence
        D1: single_or_stage_dissemination
        D2: repeated_but_unstable_dissemination
        D3: sustained_stable_dissemination
      guards: [production_and_dissemination_separate, state_and_event_separate, L1_or_L2_does_not_upgrade_state, position_or_institution_does_not_prove_action_continuity]
    event_card:
      events: [creation_start, content_completion, substantive_edit_completion, recording_or_production_completion, first_publication, republication_or_reissue, public_presentation_or_broadcast, distribution_expansion, pause, resumption, termination, withdrawal_or_takedown, exit_from_direct_action, actual_reach, influence_emergence_or_expansion_or_weakening]
      guards: [single_event_does_not_create_P3_or_D3, historical_event_does_not_prove_current_state, production_publication_reach_and_influence_have_separate_timepoints]
    result_layers:
      L0:
        meaning: base_function_established
        proof: production_path_closed_or_dissemination_path_closed
      L1:
        meaning: actual_reach
        proof: independent_evidence_of_actual_receipt_viewing_listening_reading_or_participation
      L2:
        meaning: content_influence
        proof: independent_evidence_that_specific_content_caused_or_materially_contributed_to_cognitive_attitudinal_emotional_discussion_decision_or_behavior_change
      guards: [no_mutual_backfill, reachability_is_not_actual_reach, actual_reach_is_not_influence, scale_followers_clicks_awards_liking_fame_income_controversy_or_negative_exposure_record_only_what_they_directly_prove]
    competing_functions: [F02, F04, F05, F06, F07, F08, F10, F11]
    strongest_competing_explanation:
      method: action_slice_plus_direct_function_purpose_plus_independent_gate
      unique_competing_function: null
      candidates:
        F02: new_knowledge_or_method_research_output
        F04: project_organization_or_resource_coordination_without_direct_content_action
        F05_F06: organizational_compliance_procedure_or_rule_implementation
        F07: customer_acquisition_or_transaction_closing
        F08: platform_media_or_cultural_business_responsibility
        F10: identifiable_learner_mastery
        F11: one_to_one_health_or_crisis_intervention_expression
      coexistence_boundary: only_independently_closed_actions_may_coexist
      unresolved_disambiguation: [UNKNOWN, HUMAN_REVIEW]
    theory_origin_gate:
      O_object_gate: 同一派同一命局在组合语境中形成可定位内容／表达对象，并区分思想能力、素材、载体、职业名与已形成内容。
      A_action_gate: 同一派同一命局出现命主对该对象的形成、编辑、呈现、发布、连通、扩散或面向受众作用之一，并可定位作用方向与承载。
      production_candidate: content_object_plus_formation_or_completion_action
      dissemination_candidate: content_object_plus_dissemination_action_plus_audience_or_external_reachability_direction
      guards: [same_school_same_chart_same_chain, each_school_independent, no_reality_occupation_feedback_backfill, no_single_symbol_stacking, influence_is_enhancement_not_O_or_A, theory_does_not_backfill_reality_PD_or_L0_L2]
    source_gate: null
    root_assessment:
      dimensions: [content_object, action_direction, audience_or_external_reachability_direction, carrier]
      production_and_dissemination_rated_separately: true
      STRONG_ROOT: 原局同派同局同链已闭合 O＋A，并具备对应生产或传播链全部核心节点。
      WEAK_ROOT: 原局已有可定位内容对象及同方向作用基础，但缺一个非核心连接、外部可达方向或稳定承载，允许岁运补全。
      NO_ROOT: 原局未闭合 O 门、未见命主同方向作用，或只有食伤、印、纸张、丙丁、网络、媒体、名气、职业等关联象。
      guards: [production_root_does_not_upgrade_dissemination_root, dissemination_candidate_cannot_skip_content_object, stronger_competing_explanation_downgrades_or_excludes, each_school_rated_independently, reality_and_later_timing_do_not_upgrade_root]
    timing_completion:
      separate_paths: [production, dissemination]
      ACTIVATE_EXISTING: 原局同派同局同链已闭合对应 O＋A 及核心承载，岁运仅使既有内容形成、发布或呈现节点到位或发动。
      COMPLETE_LATENT: 原局已有可定位内容对象和同方向作用基础，岁运只补一个缺失连接、外部可达方向或承载。
      REPAIR_DEFECT: 原局已有对应链但形成、编辑、呈现、发布、连通或承载受阻，岁运解除障碍或恢复作用。
      TEMPORARY_SUBSTITUTE: 岁运临时引入相似内容对象、媒介、平台、受众或作用关系，仅支持阶段性借象，不宣称原局长期生产或传播路径。
      INVALID_COMPLETION: 只凑齐表面关联，或对象错误、动作不归命主、无受众方向、跨派拼门、竞争解释更强。
      guards: [one_completion_per_path_and_window, NO_ROOT_cannot_ACTIVATE_EXISTING, NO_ROOT_COMPLETE_LATENT_defaults_to_temporary_assembly, timing_does_not_backfill_root_reality_PD_L0_L2_work_or_occupation]
    bounded_real_world_outcomes:
      establishment_or_entry:
        center: first_qualified_externalized_content_completion_or_first_qualified_dissemination
        alternatives: [new_long_term_verifiable_content_duty, resumption_of_interrupted_direct_action]
        weak_hit: short_term_assistance_or_single_limited_dissemination
      strengthening_or_stability:
        center: material_increase_in_P_or_D_continuity_responsibility_scope_or_content_reception
        alternatives: [stable_content_series, reach_or_channel_expansion_while_direct_action_continues]
        weak_hit: increased_frequency_without_stability
      weakening_pause_termination_or_exit:
        center: substantive_pause_termination_or_exit_from_verified_P_or_D_state
        alternatives: [shift_to_pure_management_business_technology_or_sales_without_direct_content_action, substantive_responsibility_contraction]
        weak_hit: short_reduction_or_local_duty_change
      temporary_or_stage_analogy:
        center: qualified_content_or_dissemination_completed_in_limited_window_without_stable_path
        alternatives: [verifiable_personal_contribution_in_temporary_collaboration, one_time_public_presentation_or_distribution]
        weak_hit: only_partial_action_or_timepoint_confirmed
      common_limits:
        center_max: 1
        alternatives_max: 2
        alternatives_same_domain_and_direction: true
        L1_or_L2_does_not_replace_outcome: true
        counterevidence: [plan_only, ability_only, occupation_only, institution_only, platform_only, work_title_only, fame_only, followers_only, clicks_only, awards_only, income_only, controversy_only, team_result_only, being_reported_only]
        taxonomy_gap: TAXONOMY_GAP
    coverage:
      theory_family: partial
      modern_lineage: strong
      mid_granularity_function: strong
      specific_occupation_outcome: partial
    output_precision:
      T0:
        allowed: 存在内容形成或传播方向候选
        forbidden: [real_production, publication, actual_reach, influence, specific_role, specific_occupation]
      T1:
        separate_paths: [production, dissemination]
        allowed_states: [established, strengthened, weakened, temporary]
        requires: [same_school_same_chart_same_chain, reality_gate, theory_origin_gate, root_assessment, timing_completion]
        forbidden_specificity: [medium, content_type, occupation]
      T2:
        restricted: true
        examples: [记者, 编辑, 作家, 主持, 演员, 主播, 自媒体, 宣传岗位, 文章, 节目, 影像]
        requires: [same_school_subclassification_constraint, independent_real_world_action_evidence, strongest_competing_explanation_excluded]
        insufficient_evidence_fallback: T1
      default_max: T1
    counterexamples:
      - {id: F12-X01, fact: 有思想无外化成果, verdict: not_established}
      - {id: F12-X02, fact: 有完成稿未发布, verdict: production_only}
      - {id: F12-X03, fact: 转载或转述但无可核验归属, verdict: not_established}
      - {id: F12-X04, fact: 纯排版、印刷、物流、设备或平台维护, verdict: not_established}
      - {id: F12-X05, fact: 被采访、被报道或被动出镜, verdict: not_established}
      - {id: F12-X06, fact: 团队作品但个人贡献不可核验, verdict: not_attributed_to_subject}
      - {id: F12-X07, fact: 媒体或文化机构任职但无直接动作, verdict: not_established}
      - {id: F12-X08, fact: 广告、直播或演讲以成交为核心, verdict: F07_priority}
      - {id: F12-X09, fact: 课程表达以学习者掌握为核心, verdict: F10_priority}
      - {id: F12-X10, fact: 研究成果本身, verdict: F02_priority_and_F12_only_with_independent_externalization_or_publication}
      - {id: F12-X11, fact: 行政宣传以服从、程序或规则实施为核心, verdict: F05_or_F06_priority}
      - {id: F12-X12, fact: 粉丝、点击、获奖、名气、收入、争议或负面曝光, verdict: record_direct_proof_only_and_no_base_gate_backfill}
    contradiction_guards:
      reality: {independent_fields: [object, action, attribution, audience], mutual_backfill_forbidden: true}
      theory: {cross_school_chart_case_splicing_forbidden: true}
      timing: {event_backfills_root_forbidden: true, historical_event_proves_current_state_forbidden: true, event_layer_upgrades_state_layer_forbidden: true}
      output: {T_upgrade_from: [coverage, confidence, occupation_feedback, single_symbol], forbidden: true}
    conflict_priority: [negative_evidence, strongest_competing_explanation, abstention]
    unresolved_output: [UNKNOWN, HUMAN_REVIEW]
    unresolved_fields: [source_gate]
    source_refs: [SRC-SNAPSHOT-F12]

competition_matrix:
  status: complete_recovery
  decision_dimensions:
    - primary_responsibility
    - primary_action
    - direct_object
    - primary_deliverable
    - primary_uncertainty
    - stable_input
    - strongest_competing_explanation
  coexistence_requires_independent_closed_chains: true
  recovered_edges:
    - functions: [F01, F02]
      priority_rule: 使用已有知识解决已知现实问题归 F01；产生新增知识或方法并完成验证归 F02。
      source_refs: [SRC-SNAPSHOT-F01, SRC-SNAPSHOT-F02]
    - functions: [F01, F03]
      priority_rule: 专业诊断、设计、核算、审查或复杂调试归 F01；按既定方法稳定转换与连续交付归 F03。
      source_refs: [SRC-SNAPSHOT-F01, SRC-SNAPSHOT-F03]
    - functions: [F01, F04]
      priority_rule: 专业方案责任归 F01；多人、资源、进度与整体交付协调归 F04。
      source_refs: [SRC-SNAPSHOT-F01]
    - functions: [F01, F09]
      priority_rule: 核算、审计和财务专业判断归 F01；投资、融资与资本波动承担归 F09。
