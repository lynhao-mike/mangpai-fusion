# 跑分器只读本文件；卡面未写的口径以卡面为准。跑分中不得改本文件。
#
# 2026-10-28 23:05 中枢裁决（PROMPT §7）：
#   1) 敏感性集为 336（947 的 label 是 unknown，不在 342；不为凑 335 另挑 1 例）。
#   2) 判定改为两比例检验（Newcombe 95% CI + Fisher 精确检验双侧）：
#      baseline_single 对「恒预测 N + 弃权」的单标签规则退化，accuracy 恒等于 baseline，
#      「超过基线」分支不可达；accuracy / baseline 只作描述，不作判定。
#
# 硬口径：只用 triggered，不用 outcome 筛样本、不用 outcome 计分（T-152 §9）。
# outcome 只作「反条件若可用会怎样」的描述，不参与任何判定。

